# OpenCode Go for coding models, Zen for Claude and Ling.
# Claude Code speaks Anthropic /v1/messages; LiteLLM translates to OpenCode.
#
# OpenCode Go requires x-opencode-session on the wire. LiteLLM's OpenAI client
# drops Claude Code's X-Claude-Code-Session-Id, so every entry sends a
# per-install id that cc.sh generates into .env.
x-opencode: &opencode
  api_key: os.environ/OPENCODE_API_KEY
  extra_headers:
    x-opencode-session: os.environ/OPENCODE_SESSION_ID
    User-Agent: claude-sandbox/1.0

model_list:
  - model_name: deepseek-v4-pro
    litellm_params:
      <<: *opencode
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
  - model_name: deepseek-v4-flash
    litellm_params:
      <<: *opencode
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/go/v1
  - model_name: deepseek-v4.1-flash
    litellm_params:
      <<: *opencode
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/zen/go/v1
  - model_name: kimi-k3
    litellm_params:
      <<: *opencode
      model: openai/kimi-k3
      api_base: https://opencode.ai/zen/go/v1
  - model_name: kimi-k2.7-code
    litellm_params:
      <<: *opencode
      model: openai/kimi-k2.7-code
      api_base: https://opencode.ai/zen/go/v1

  - model_name: ling-3.1-flash
    litellm_params:
      <<: *opencode
      model: openai/ling-3.1-flash-free
      api_base: https://opencode.ai/zen/v1

  - model_name: claude-opus-5-5
    litellm_params:
      <<: *opencode
      model: anthropic/claude-opus-5-5
      api_base: https://opencode.ai/zen
  - model_name: claude-sonnet-5-5
    litellm_params:
      <<: *opencode
      model: anthropic/claude-sonnet-5
      api_base: https://opencode.ai/zen

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
