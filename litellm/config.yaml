# Session overlay: OpenCode Go for coding models; Zen for Claude and Ling.
# Claude Code speaks Anthropic /v1/messages; LiteLLM translates to OpenCode.
#
# OpenCode Go requires x-opencode-session on the wire. Claude Code sends
# X-Claude-Code-Session-Id, but LiteLLM's OpenAI client drops it, so Go
# returns 400. Stamp a stable session id and a non-generic User-Agent here.

model_list:
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_API_KEY
      extra_headers:
        x-opencode-session: 61ed6b8c-fee4-4740-a7d7-77c9522dae2e
        User-Agent: claude-sandbox/1.0
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_API_KEY
      extra_headers:
        x-opencode-session: 61ed6b8c-fee4-4740-a7d7-77c9522dae2e
        User-Agent: claude-sandbox/1.0
  - model_name: deepseek-v4.1-flash
    litellm_params:
